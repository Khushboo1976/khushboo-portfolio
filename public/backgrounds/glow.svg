  <circle cx="300" cy="300" r="260" fill="url(#blue-glow-core)" filter="url(#blue-glow-blur)"/>

  <circle cx="300" cy="300" r="180" fill="none" stroke="#38BDF8" stroke-width="0.75" opacity="0.18"/>
  <circle cx="300" cy="300" r="130" fill="none" stroke="#38BDF8" stroke-width="0.75" opacity="0.14"/>
