<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="blueprint-grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#3B82F6" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <pattern id="blueprint-grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#blueprint-grid-minor)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>

  <g opacity="0.07">
    <rect width="800" height="800" fill="url(#blueprint-grid-major)">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="100 100"
        dur="40s"
        repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
