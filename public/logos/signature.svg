       C542 194 564 190 586 118
       C606 55 635 62 646 140
       C653 186 672 190 695 128
       C718 67 748 75 756 145
       C764 197 786 195 815 130"
    fill="none"
    stroke="url(#gold)"
    stroke-width="7"
    stroke-linecap="round"
