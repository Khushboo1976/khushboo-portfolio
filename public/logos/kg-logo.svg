<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="20%" stop-color="#f6d365"/>
      <stop offset="50%" stop-color="#d4a33a"/>
      <stop offset="80%" stop-color="#f8df8b"/>
      <stop offset="100%" stop-color="#9c6b12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="none"/>

  <circle cx="400" cy="400" r="255"
