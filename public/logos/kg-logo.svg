    <!-- K -->
    <path d="M265 205 L265 595"
          stroke-width="34"/>
    <path d="M270 400 L485 205"
          stroke-width="28"/>
    <path d="M270 400 L495 595"
          stroke-width="28"/>

    <!-- G -->
    <path d="M575 270
             C520 225 430 235 380 305
             C330 375 345 485 420 540
             C505 602 615 545 620 455
             L520 455"
          stroke-width="34"/>
  </g>

  <!-- Accent slash -->
  <path d="M210 610 L610 220"
